name: Build and Deploy

on:
  push:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: Install dependencies (main)
        run: |
          pip install -r requirements.txt
          npm install

      - name: Build main
        env:
          SITE_URL: https://beta.insinistra.com
        run: python build.py

      - name: Check if dev branch exists
        id: dev_check
        run: |
          if git ls-remote --exit-code --heads origin dev >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build dev into /dev
        if: steps.dev_check.outputs.exists == 'true'
        env:
          SITE_URL: https://beta.insinistra.com/dev
        run: |
          # region agent log
          LOG_FILE="${GITHUB_WORKSPACE}/debug-627acb.log"
          log_ndjson() {
            python - "$1" "$2" "$3" "$4" <<'PY'
import json, sys, time
path, hyp, loc, msg = sys.argv[1:5]
entry = {
  "sessionId": "627acb",
  "runId": "pre-fix",
  "hypothesisId": hyp,
  "location": loc,
  "message": msg,
  "data": {},
  "timestamp": int(time.time() * 1000),
}
with open(path, "a", encoding="utf-8") as f:
  f.write(json.dumps(entry) + "\n")
PY
          }
          # endregion
          set -euo pipefail
          # region agent log
          log_ndjson "$LOG_FILE" "H1" ".github/workflows/deploy.yaml:build-dev" "start build dev step"
          # endregion
          rm -rf ../dev-src
          trap 'git worktree remove --force ../dev-src >/dev/null 2>&1 || true' EXIT
          # region agent log
          log_ndjson "$LOG_FILE" "H2" ".github/workflows/deploy.yaml:git-fetch" "before git fetch origin dev"
          # endregion
          git fetch origin dev
          # region agent log
          log_ndjson "$LOG_FILE" "H2" ".github/workflows/deploy.yaml:git-fetch" "after git fetch origin dev"
          # endregion
          # region agent log
          log_ndjson "$LOG_FILE" "H3" ".github/workflows/deploy.yaml:worktree-add" "before worktree add"
          # endregion
          git worktree add --detach ../dev-src origin/dev
          # region agent log
          log_ndjson "$LOG_FILE" "H3" ".github/workflows/deploy.yaml:worktree-add" "after worktree add"
          # endregion
          cd ../dev-src
          # region agent log
          log_ndjson "$LOG_FILE" "H4" ".github/workflows/deploy.yaml:dev-build" "before dev dependency install and build"
          # endregion
          pip install -r requirements.txt
          npm install
          python build.py
          # region agent log
          log_ndjson "$LOG_FILE" "H4" ".github/workflows/deploy.yaml:dev-build" "after dev dependency install and build"
          # endregion
          cd "${GITHUB_WORKSPACE}"
          rm -rf dist/dev
          # region agent log
          log_ndjson "$LOG_FILE" "H5" ".github/workflows/deploy.yaml:move-artifacts" "before mv dev dist to dist/dev"
          # endregion
          mv ../dev-src/dist dist/dev
          rm -f dist/dev/CNAME
          # region agent log
          log_ndjson "$LOG_FILE" "H5" ".github/workflows/deploy.yaml:move-artifacts" "after mv dev dist to dist/dev"
          # endregion

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages

    steps:
      - name: Deploy
        uses: actions/deploy-pages@v4
