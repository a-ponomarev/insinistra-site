name: Build and Deploy

on:
  push:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: Install dependencies (main)
        run: |
          pip install -r requirements.txt
          npm install

      - name: Build main
        env:
          SITE_URL: https://beta.insinistra.com
        run: python build.py

      - name: Check if dev branch exists
        id: dev_check
        run: |
          if git ls-remote --exit-code --heads origin dev >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build dev into /dev
        if: steps.dev_check.outputs.exists == 'true'
        env:
          SITE_URL: https://beta.insinistra.com/dev
        run: |
          set -euo pipefail
          rm -rf ../dev-src
          trap 'git worktree remove --force ../dev-src >/dev/null 2>&1 || true' EXIT
          git fetch origin dev
          git worktree add --detach ../dev-src origin/dev
          cd ../dev-src
          pip install -r requirements.txt
          npm install
          python build.py
          cd "${GITHUB_WORKSPACE}"
          rm -rf dist/dev
          mv ../dev-src/dist dist/dev
          rm -f dist/dev/CNAME

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages

    steps:
      - name: Deploy
        uses: actions/deploy-pages@v4
