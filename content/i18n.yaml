  default_meta_description: >-
    Insinistra — symfonický metal z Prahy. Oficiální web: hudba, koncerty,
    fotky, videa a press kit.
  meta_descriptions:
    home: >-
      Zahalená ve tmavě fialové mlze, někde mezi ukolébavkou a noční můrou,
      Insinistra sídlící v Praze nabízí symfometalový zážitek, ztemnělý a sladký zároveň.
    shows: >-
      Koncerty Insinistry — nadcházející i minulá vystoupení, s odkazy na vstupenky
      a události, kde jsou k dispozici.
    albums: >-
      Diskografie Insinistry — singly, EP a další vydání. Poslouchejte na Bandcampu,
      Spotify, Apple Music a dalších platformách.
    photos: >-
      Fotogalerie Insinistry — fotky z koncertů a promo snímky kapely.
    epk: >-
      Elektronický press kit Insinistry — krátké bio, odkazy na streamování, press
      fotky, videa a kontakty na booking a média pro festivaly a novináře.
    about: >-
      O Insinistře — symfonický metal z Prahy. Biografie kapely, sestava a zvuk
      mezi ukolébavkou a noční můrou.
    contact: >-
      Kontakt na Insinistru — booking, média a obecný e-mail. Ke stažení press kit
      a stage plan.
