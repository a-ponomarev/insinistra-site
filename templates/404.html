{% extends "base.html" %}

{% block title %}{{ t.not_found_title }}{% endblock %}

{% block extra_head %}
<meta name="robots" content="noindex">
{% endblock %}

{% block content %}
<article class="page page-not-found">
    <div class="page-not-found__middle">
        <p class="page-not-found__code" aria-hidden="true"><span class="page-not-found__code-inner">404</span></p>
        <div class="page-not-found__divider" role="presentation"></div>
        <h1 class="page-not-found__heading visually-hidden">{{ t.not_found_heading }}</h1>
        <p class="page-not-found__lead">{{ t.not_found_lead }}</p>
        <a href="." class="btn">{{ t.back_home }}</a>
    </div>
    <div class="hero-social-mobile" aria-label="{{ t.social_links }}">
        {% include "partials/social_links.html" %}
    </div>
</article>
{% endblock %}
